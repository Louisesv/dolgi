<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Трекер долгов по постам</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .app-header h1 { font-size: 1.5rem; font-weight: 600; color: #1a1a2e; }
        .app-header .status-group {
            display: flex; align-items: center; gap: 1.2rem;
            font-size: 0.85rem; color: #6b7280;
        }
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            margin-right: 6px; background: #d1d5db; transition: 0.3s;
        }
        .status-dot.online { background: #10b981; box-shadow: 0 0 12px rgba(16,185,129,0.3); }
        .status-dot.offline { background: #ef4444; }
        .counter-badge {
            background: #f3f4f6; padding: 0.3rem 1rem; border-radius: 40px;
            font-size: 0.8rem; font-weight: 500; color: #374151;
        }

        .main-layout { display: flex; gap: 2rem; align-items: flex-start; }
        .left-col { flex: 0 0 200px; min-width: 160px; }
        .right-col { flex: 1; min-width: 0; }

        .char-card {
            background: #fafbfc; border: 2px solid #e5e7eb; border-radius: 12px;
            padding: 14px 16px; margin-bottom: 8px; cursor: pointer; transition: 0.2s;
        }
        .char-card:hover { background: #f3f4f6; border-color: #d1d5db; }
        .char-card.active { border-color: #4f46e5; background: #eef2ff; }
        .char-card .name { font-size: 1rem; font-weight: 600; }
        .char-card .stats { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }
        .char-card .stats span { margin-right: 12px; }
        .char-card .delete-char {
            float: right; background: none; border: none; color: #d1d5db;
            cursor: pointer; font-size: 0.9rem; transition: 0.2s; padding: 0 4px;
        }
        .char-card .delete-char:hover { color: #ef4444; }

        .char-panel {
            background: #fafbfc; border-radius: 12px; border: 2px solid #e5e7eb;
            overflow: hidden; padding: 0;
        }

        .char-header {
            display: flex; gap: 20px; padding: 20px 24px;
            background: #ffffff; border-bottom: 2px solid #e5e7eb;
            flex-wrap: wrap; align-items: center;
        }
        .char-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: cover; border: 3px solid #e5e7eb;
            flex-shrink: 0; background: #f0f2f5;
        }
        .char-info { flex: 1; min-width: 150px; }
        .char-info .char-name { font-size: 1.3rem; font-weight: 600; }
        .char-info .char-desc { font-size: 0.9rem; color: #6b7280; margin-top: 2px; }
        .char-info .char-stats {
            font-size: 0.8rem; color: #6b7280; margin-top: 6px;
        }
        .char-info .char-stats span { margin-right: 16px; }

        .panel-body { padding: 16px 20px; }

        .section-title {
            font-size: 0.8rem; font-weight: 600; color: #6b7280;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin: 16px 0 8px 0;
        }
        .section-title:first-of-type { margin-top: 0; }

        .closed-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .closed-tag {
            background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 20px;
            padding: 4px 14px; font-size: 0.8rem; cursor: pointer;
            transition: 0.2s; color: #374151;
        }
        .closed-tag:hover { background: #e5e7eb; }
        .closed-tag.active { border-color: #4f46e5; background: #eef2ff; }
        .closed-result {
            margin-top: 8px; padding: 10px 14px; background: #fef3c7;
            border-radius: 8px; font-size: 0.9rem; color: #92400e;
            border-left: 4px solid #f59e0b;
        }
        .closed-empty { color: #9ca3af; font-size: 0.85rem; font-style: italic; }

        .ep-select {
            width: 100%; padding: 10px 14px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 0.95rem; background: #ffffff;
            color: #1a1a2e; font-family: inherit; cursor: pointer;
            outline: none; transition: 0.2s; margin-bottom: 12px;
        }
        .ep-select:focus { border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79,70,229,0.08); }

        .ep-display {
            background: #ffffff; border: 2px solid #e5e7eb; border-radius: 10px;
            padding: 16px 20px; margin-top: 4px;
        }
        .ep-display .ep-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            flex-wrap: wrap; gap: 8px; margin-bottom: 4px;
        }
        .ep-display .ep-title { font-size: 1.05rem; font-weight: 600; }
        .ep-display .ep-meta { font-size: 0.85rem; color: #6b7280; margin-bottom: 4px; }
        .ep-display .ep-link {
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        .ep-display .ep-link a {
            color: #4f46e5;
            text-decoration: none;
            word-break: break-all;
        }
        .ep-display .ep-link a:hover {
            text-decoration: underline;
        }
        .ep-display .ep-link .link-label {
            color: #6b7280;
            font-weight: 500;
        }

        .quest-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: #fee2e2; color: #dc2626; font-weight: 700;
            font-size: 0.7rem; padding: 2px 10px; border-radius: 20px;
            border: 2px solid #dc2626; cursor: pointer; transition: 0.2s;
            user-select: none; letter-spacing: 0.5px;
        }
        .quest-badge:hover { background: #fecaca; transform: scale(1.02); }
        .quest-badge.active { background: #dc2626; color: #ffffff; border-color: #dc2626; }
        .quest-badge .star { font-size: 0.8rem; }

        .players-vertical {
            display: flex; flex-direction: column; gap: 6px;
            margin: 8px 0 12px 0;
        }
        .player-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 8px;
            border: 2px solid transparent; background: #fafbfc;
            transition: 0.2s;
        }
        .player-row.done { opacity: 0.4; text-decoration: line-through; color: #6b7280; }
        .player-row.next {
            border-color: #4f46e5; background: #eef2ff;
            box-shadow: 0 2px 12px rgba(79,70,229,0.08);
        }
        .player-row .pname { flex: 1; font-size: 0.95rem; font-weight: 500; }
        .player-row .pname.done-name { text-decoration: line-through; color: #6b7280; }
        .player-row input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: #4f46e5; cursor: pointer;
        }
        .player-row input[type="checkbox"]:disabled { cursor: not-allowed; opacity: 0.5; }
        .player-row .delete-player {
            background: none; border: none; color: #d1d5db;
            cursor: pointer; font-size: 0.9rem; transition: 0.2s; padding: 0 4px;
        }
        .player-row .delete-player:hover { color: #ef4444; }

        .ep-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

        .btn {
            padding: 6px 18px; border-radius: 8px; border: none;
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: 0.2s; font-family: inherit;
        }
        .btn-primary { background: #4f46e5; color: #ffffff; }
        .btn-primary:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,0.25); }
        .btn-success { background: #10b981; color: #ffffff; }
        .btn-success:hover { background: #059669; transform: translateY(-1px); }
        .btn-warning { background: #f59e0b; color: #ffffff; }
        .btn-warning:hover { background: #d97706; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid #e5e7eb; color: #374151; }
        .btn-outline:hover { background: #f3f4f6; border-color: #d1d5db; }
        .btn-sm { padding: 3px 12px; font-size: 0.75rem; }
        .btn-danger { background: #ef4444; color: #ffffff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-danger-outline { background: transparent; border: 2px solid #ef4444; color: #ef4444; }
        .btn-danger-outline:hover { background: #fee2e2; }

        /* Форма добавления участника */
        .add-player-block {
            display: flex; gap: 10px; flex-wrap: wrap;
            padding: 8px 16px; margin: 0 0 12px 0;
            background: #fafbfc; border-radius: 8px;
            border: 1px dashed #e5e7eb;
            align-items: center;
        }
        .add-player-block input {
            padding: 5px 10px; border: 2px solid #e5e7eb; border-radius: 6px;
            font-size: 0.85rem; outline: none; font-family: inherit;
            background: #ffffff; transition: 0.2s; flex: 1; min-width: 100px;
        }
        .add-player-block input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }
        .add-player-block input::placeholder { color: #9ca3af; }

        .quest-filter {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 8px; padding: 6px 12px;
            background: #fafbfc; border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
        .quest-filter label {
            font-size: 0.8rem; color: #6b7280; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
        }
        .quest-filter input[type="checkbox"] {
            width: 16px; height: 16px; accent-color: #dc2626; cursor: pointer;
        }

        /* ===== ГЛАВНАЯ КНОПКА ДОБАВЛЕНИЯ ===== */
        .fab-add-ep {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #4f46e5;
            color: #ffffff;
            border: none;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(79, 70, 229, 0.4);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .fab-add-ep:hover {
            transform: scale(1.08);
            background: #4338ca;
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.5);
        }

        /* ===== МОДАЛКА ДОБАВЛЕНИЯ ЭПИЗОДА ===== */
        .modal-add-ep {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }
        .modal-add-ep.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-add-ep .modal-content {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 32px;
            max-width: 520px;
            width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
        }
        .modal-add-ep .modal-content h2 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 16px;
        }
        .modal-add-ep .modal-content label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin: 12px 0 4px 0;
        }
        .modal-add-ep .modal-content select,
        .modal-add-ep .modal-content input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            background: #fafbfc;
            transition: 0.2s;
        }
        .modal-add-ep .modal-content select:focus,
        .modal-add-ep .modal-content input:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }
        .modal-add-ep .modal-content textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            outline: none;
            background: #fafbfc;
            transition: 0.2s;
        }
        .modal-add-ep .modal-content textarea:focus {
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }
        .modal-add-ep .modal-content .hint {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 4px;
        }
        .modal-add-ep .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .modal-add-ep .modal-actions .btn-cancel {
            background: transparent;
            border: 2px solid #e5e7eb;
            color: #374151;
            padding: 8px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
            font-family: inherit;
        }
        .modal-add-ep .modal-actions .btn-cancel:hover {
            background: #f3f4f6;
        }
        .modal-add-ep .modal-actions .btn-confirm {
            background: #4f46e5;
            border: none;
            color: #ffffff;
            padding: 8px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s;
            font-family: inherit;
        }
        .modal-add-ep .modal-actions .btn-confirm:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 998; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        .modal-overlay .modal-content {
            background: #ffffff; border-radius: 16px; padding: 24px;
            max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .modal-overlay .modal-content h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        .modal-overlay .modal-content p { color: #6b7280; font-size: 0.9rem; margin-bottom: 12px; }
        .modal-overlay .modal-content textarea {
            width: 100%; padding: 10px 12px; border: 2px solid #e5e7eb;
            border-radius: 10px; font-size: 0.9rem; font-family: inherit;
            resize: vertical; min-height: 80px; margin-bottom: 12px;
            outline: none; transition: 0.2s; background: #fafbfc;
        }
        .modal-overlay .modal-content textarea:focus {
            border-color: #4f46e5; background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79,70,229,0.08);
        }
        .modal-overlay .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

        /* Глобальный блок очереди */
        .global-queue-block {
            background: #fef9e7;
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .global-queue-block .queue-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d97706;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .global-queue-block .queue-item {
            font-size: 0.9rem;
            padding: 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fde68a;
            cursor: pointer;
            transition: 0.2s;
        }
        .global-queue-block .queue-item:last-child { border-bottom: none; }
        .global-queue-block .queue-item:hover {
            background: #fef3c7;
            margin: 0 -4px;
            padding: 4px;
            border-radius: 4px;
        }
        .global-queue-block .queue-char {
            font-weight: 500;
            color: #1a1a2e;
        }
        .global-queue-block .queue-ep {
            color: #4f46e5;
            font-size: 0.85rem;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
            transition: 0.2s;
        }
        .global-queue-block .queue-ep:hover {
            color: #4338ca;
        }
        .global-queue-block .queue-ep a {
            color: inherit;
            text-decoration: none;
        }
        .global-queue-block .queue-empty {
            color: #9ca3af;
            font-style: italic;
            font-size: 0.9rem;
            padding: 4px 0;
        }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .left-col { flex: 1; width: 100%; min-width: 0; }
            .container { padding: 1.2rem 1rem; }
            .char-card { display: inline-block; margin-right: 8px; margin-bottom: 8px; padding: 10px 14px; }
            .char-card .stats { display: none; }
            .char-header { flex-direction: column; align-items: center; text-align: center; }
            .char-avatar { width: 60px; height: 60px; }
            .players-vertical { gap: 4px; }
            .player-row { padding: 6px 10px; }
            .ep-display .ep-header { flex-direction: column; align-items: stretch; }
            .fab-add-ep { width: 50px; height: 50px; font-size: 26px; bottom: 20px; right: 20px; }
            .modal-add-ep .modal-content { padding: 20px; }
        }
        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .container { padding: 1rem 0.8rem; border-radius: 12px; }
            .app-header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <h1>📋 Трекер долгов по постам</h1>
        <div class="status-group">
            <span>
                <span class="status-dot offline" id="statusDot"></span>
                <span id="statusText">Подключение...</span>
            </span>
            <span class="counter-badge" id="counterBadge">0 эпизодов</span>
        </div>
    </div>

    <div class="main-layout">
        <div class="left-col" id="charactersList"></div>
        <div class="right-col">
            <div id="globalQueueBlock"></div>
            <div class="char-panel" id="charPanel">
                <div style="padding:40px 20px;text-align:center;color:#9ca3af;">
                    👈 Выберите персонажа слева
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== КНОПКА ДОБАВЛЕНИЯ ЭПИЗОДА (ПЛАВАЮЩАЯ) ===== -->
<button class="fab-add-ep" id="fabAddEp" title="Добавить эпизод">➕</button>

<!-- ===== МОДАЛКА ДОБАВЛЕНИЯ ЭПИЗОДА ===== -->
<div class="modal-add-ep" id="modalAddEp">
    <div class="modal-content">
        <h2>➕ Новый эпизод</h2>

        <label for="addEpCharSelect">Персонаж</label>
        <select id="addEpCharSelect">
            <option value="">— Выберите персонажа —</option>
        </select>

        <label for="addEpTitle">Название эпизода</label>
        <input type="text" id="addEpTitle" placeholder="Например: wellerman" />

        <label for="addEpMeta">Дополнительная информация</label>
        <input type="text" id="addEpMeta" placeholder="Например: 302г от з.э. — Эйгон, Деймон, Алисса Веларион" />

        <label for="addEpLink">Ссылка на эпизод</label>
        <input type="text" id="addEpLink" placeholder="https://example.com/episode" />

        <label for="addEpPlayers">Участники</label>
        <textarea id="addEpPlayers" placeholder="Каждый участник с новой строки&#10;Например:&#10;Эйгон&#10;Деймон&#10;Алисса Веларион"></textarea>
        <div class="hint">✏️ Каждое имя с новой строки</div>

        <div style="margin-top: 12px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400;font-size:0.9rem;">
                <input type="checkbox" id="addEpQuest" /> ⭐ Отметить как квест
            </label>
        </div>

        <div class="modal-actions">
            <button class="btn-cancel" id="addEpCancel">Отмена</button>
            <button class="btn-confirm" id="addEpConfirm">➕ Создать</button>
        </div>
    </div>
</div>

<!-- ===== МОДАЛКА ЗАВЕРШЕНИЯ ЭПИЗОДА ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <h3>📝 Завершить эпизод</h3>
        <p>Напишите итог эпизода (необязательно)</p>
        <textarea id="modalComment" placeholder="Итог эпизода..."></textarea>
        <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancel">Отмена</button>
            <button class="btn btn-success" id="modalConfirm">Завершить</button>
        </div>
    </div>
</div>

<script>
// ================================================================
// КОНФИГ FIREBASE
// ================================================================

function loadData() {
    db.ref(DB_PATH).on('value', function(snapshot) {
        const val = snapshot.val();
        if (val) {
            data = val;
            // Для старых эпизодов без link добавляем пустую строку
            Object.keys(data.characters || {}).forEach(charId => {
                const ch = data.characters[charId];
                Object.keys(ch.episodes || {}).forEach(epId => {
                    if (!ch.episodes[epId].hasOwnProperty('link')) {
                        ch.episodes[epId].link = '';
                    }
                });
            });
        } else {
            data = getDefaultData();
            db.ref(DB_PATH).set(data);
        }
        renderAll();
        updateAddEpSelect();
        renderGlobalQueue();
    }, function(error) {
        console.error('Ошибка загрузки:', error);
    });
}

function saveData() {
    if (data) {
        db.ref(DB_PATH).set(data);
    }
}

// ================================================================
// РЕНДЕРИНГ
// ================================================================
function renderAll() {
    if (!data) return;
    renderCharacters();
    if (selectedChar && data.characters[selectedChar]) {
        renderCharPanel(selectedChar);
    } else {
        charPanel.innerHTML = `
            <div style="padding:40px 20px;text-align:center;color:#9ca3af;">
                👈 Выберите персонажа слева
            </div>
        `;
    }
    updateCounter();
    updateAddEpSelect();
    renderGlobalQueue();
}

function updateCounter() {
    if (!data) return;
    let total = 0;
    Object.keys(data.characters).forEach(id => {
        total += Object.keys(data.characters[id].episodes || {}).length;
    });
    counterBadge.textContent = total + ' эпизодов';
}

function updateAddEpSelect() {
    if (!data) return;
    const select = addEpCharSelect;
    const currentVal = select.value;
    select.innerHTML = '<option value="">— Выберите персонажа —</option>';
    Object.keys(data.characters).forEach(id => {
        const ch = data.characters[id];
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = ch.name;
        select.appendChild(opt);
    });
    if (currentVal && data.characters[currentVal]) {
        select.value = currentVal;
    }
}

// ================================================================
// ГЛОБАЛЬНЫЙ БЛОК ОЧЕРЕДИ
// ================================================================
function renderGlobalQueue() {
    if (!data) return;

    const targetChars = ['Эйгон', 'Линесса', 'Тристон'];
    const queueItems = [];

    Object.keys(data.characters).forEach(charId => {
        const ch = data.characters[charId];
        const episodes = ch.episodes || {};
        Object.keys(episodes).forEach(epId => {
            const ep = episodes[epId];
            if (!ep.closed) {
                const nextPlayer = ep.players.find(p => !p.done);
                if (nextPlayer && targetChars.includes(nextPlayer.name)) {
                    queueItems.push({
                        charName: ch.name,
                        charId: charId,
                        epTitle: ep.title,
                        epId: epId,
                        epLink: ep.link || '',
                        nextPlayer: nextPlayer.name
                    });
                }
            }
        });
    });

    queueItems.sort((a, b) => a.charName.localeCompare(b.charName));

    let html = '';
    if (queueItems.length > 0) {
        html = `
            <div class="global-queue-block">
                <div class="queue-title">⏳ Очередь персонажей</div>
                ${queueItems.map(item => {
                    const link = item.epLink || '#';
                    const isLink = item.epLink && item.epLink.trim() !== '';
                    return `
                        <div class="queue-item" data-char="${item.charId}" data-ep="${item.epId}">
                            <span class="queue-char">${item.charName}</span>
                            <span class="queue-ep">
                                ${isLink
                                    ? `<a href="${item.epLink}" target="_blank" rel="noopener noreferrer">${item.epTitle}</a>`
                                    : `<span style="color:#6b7280;text-decoration:none;cursor:default;">${item.epTitle}</span>`
                                }
                            </span>
                        </div>
                    `;
                }).join('')}
            </div>
        `;
    } else {
        html = `
            <div class="global-queue-block">
                <div class="queue-title">⏳ Очередь персонажей</div>
                <div class="queue-empty">Нет персонажей в очереди</div>
            </div>
        `;
    }

    globalQueueBlock.innerHTML = html;

    // Обработчики кликов для перехода к эпизоду (если нет ссылки)
    document.querySelectorAll('#globalQueueBlock .queue-item').forEach(el => {
        const epLink = el.querySelector('.queue-ep a');
        if (!epLink) {
            el.addEventListener('click', function() {
                const charId = this.dataset.char;
                const epId = this.dataset.ep;
                if (charId && epId) {
                    selectedChar = charId;
                    selectedEp = epId;
                    selectedClosed = null;
                    renderAll();
                }
            });
        }
    });
}

// ================================================================
// ПЕРСОНАЖИ (СЛЕВА)
// ================================================================
function renderCharacters() {
    if (!data) return;
    const chars = data.characters;
    let html = '';
    Object.keys(chars).forEach(function(id) {
        const ch = chars[id];
        const episodes = ch.episodes || {};
        const keys = Object.keys(episodes);
        const open = keys.filter(k => !episodes[k].closed).length;
        const closed = keys.filter(k => episodes[k].closed).length;
        const active = (selectedChar === id) ? ' active' : '';
        html += `
            <div class="char-card${active}" data-char="${id}">
                <div class="name">
                    ${ch.name}
                    <button class="delete-char" data-char="${id}" title="Удалить персонажа">✕</button>
                </div>
                <div class="stats">
                    <span>📖 ${open}</span>
                    <span>✅ ${closed}</span>
                </div>
            </div>
        `;
    });

    html += `
        <div style="margin-top:8px;display:flex;gap:6px;">
            <input type="text" id="newCharName" placeholder="Имя..." style="flex:1;padding:6px 10px;border:2px solid #e5e7eb;border-radius:8px;font-size:0.85rem;outline:none;font-family:inherit;background:#fafbfc;">
            <button class="btn btn-primary btn-sm" id="addCharBtn">➕</button>
        </div>
    `;

    charactersList.innerHTML = html;

    document.querySelectorAll('.char-card').forEach(function(el) {
        el.addEventListener('click', function(e) {
            if (e.target.closest('.delete-char')) return;
            const id = this.dataset.char;
            selectCharacter(id);
        });
    });

    document.querySelectorAll('.delete-char').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.char;
            if (!confirm(`Удалить персонажа "${data.characters[id].name}"?`)) return;
            delete data.characters[id];
            if (selectedChar === id) {
                selectedChar = null;
                selectedEp = null;
                selectedClosed = null;
            }
            saveData();
            renderAll();
        });
    });

    const addBtn = document.getElementById('addCharBtn');
    const input = document.getElementById('newCharName');
    if (addBtn) {
        addBtn.addEventListener('click', function() {
            const name = input.value.trim();
            if (!name) return;
            const id = name.toLowerCase().replace(/[^a-zа-я]/g, '');
            if (data.characters[id]) {
                alert('Персонаж с таким именем уже есть');
                return;
            }
            data.characters[id] = {
                name: name,
                avatar: '',
                desc: '',
                episodes: {}
            };
            input.value = '';
            saveData();
            renderAll();
            selectCharacter(id);
            updateAddEpSelect();
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addBtn.click();
        });
    }
}

function selectCharacter(id) {
    selectedChar = id;
    selectedEp = null;
    selectedClosed = null;
    renderAll();
}

function renderCharPanel(charId) {
    if (!data) return;
    const ch = data.characters[charId];
    if (!ch) return;

    const episodes = ch.episodes || {};
    const keys = Object.keys(episodes);
    let openKeys = keys.filter(k => !episodes[k].closed);
    let closedKeys = keys.filter(k => episodes[k].closed);

    if (showOnlyQuests) {
        openKeys = openKeys.filter(k => episodes[k].quest === true);
    }

    let epDisplay = '';
    if (selectedEp && episodes[selectedEp] && !episodes[selectedEp].closed) {
        epDisplay = renderEpisodeDisplay(charId, selectedEp);
    }

    let closedResult = '';
    if (selectedClosed && episodes[selectedClosed] && episodes[selectedClosed].closed) {
        const ep = episodes[selectedClosed];
        closedResult = `
            <div class="closed-result">
                <strong>${ep.title}</strong><br>
                ${ep.result || 'Без комментария'}
            </div>
        `;
    }

    const emptyEpisodes = openKeys.filter(k => episodes[k].players.length === 0);
    const deleteEmptyBtn = emptyEpisodes.length > 0 ? `
        <button class="btn btn-danger-outline btn-sm" id="deleteEmptyEpisodesBtn" style="margin-left:8px;">
            🗑 Удалить пустые (${emptyEpisodes.length})
        </button>
    ` : '';

    const html = `
        <div class="char-header">
            <img class="char-avatar" src="${ch.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23e5e7eb%22/%3E%3Ctext x=%2240%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2230%22 font-family=%22sans-serif%22%3E👤%3C/text%3E%3C/svg%3E'}" alt="avatar">
            <div class="char-info">
                <div class="char-name">${ch.name}</div>
                <div class="char-desc">${ch.desc || ''}</div>
                <div class="char-stats">
                    <span>📖 ${openKeys.length} открытых</span>
                    <span>✅ ${closedKeys.length} завершённых</span>
                </div>
            </div>
        </div>

        <div class="panel-body">
            <div class="section-title">✅ Завершённые эпизоды</div>
            <div class="closed-list" id="closedList">
                ${closedKeys.length === 0 ? '<span class="closed-empty">Нет завершённых эпизодов</span>' : ''}
                ${closedKeys.map(k => `
                    <span class="closed-tag ${selectedClosed === k ? 'active' : ''}" data-ep="${k}">
                        ${episodes[k].title}
                        ${episodes[k].quest ? ' ⭐' : ''}
                    </span>
                `).join('')}
            </div>
            ${closedResult}

            <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                <span>🎯 Активные эпизоды</span>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <div class="quest-filter" style="margin-bottom:0;">
                        <label>
                            <input type="checkbox" id="questFilterCheck" ${showOnlyQuests ? 'checked' : ''}>
                            ⭐ Только квесты
                        </label>
                    </div>
                    ${deleteEmptyBtn}
                </div>
            </div>

            <select class="ep-select" id="epSelect">
                <option value="">— Выберите эпизод —</option>
                ${openKeys.map(k => `
                    <option value="${k}" ${selectedEp === k ? 'selected' : ''}>
                        ${episodes[k].title} ${episodes[k].quest ? '⭐' : ''}
                        ${episodes[k].players.length === 0 ? '(пустой)' : ''}
                    </option>
                `).join('')}
            </select>

            ${epDisplay}

            <!-- Форма добавления участника -->
            <div class="add-player-block">
                <span style="font-size:0.8rem;color:#6b7280;">👤 Добавить участника:</span>
                <input type="text" id="newPlayerName" placeholder="Имя..." />
                <button class="btn btn-primary btn-sm" id="addPlayerBtn">➕</button>
            </div>
        </div>
    `;

    charPanel.innerHTML = html;

    // ============================================================
    // ОБРАБОТЧИКИ
    // ============================================================

    const deleteEmptyBtnEl = document.getElementById('deleteEmptyEpisodesBtn');
    if (deleteEmptyBtnEl) {
        deleteEmptyBtnEl.addEventListener('click', function() {
            const emptyKeys = openKeys.filter(k => episodes[k].players.length === 0);
            if (emptyKeys.length === 0) return;
            if (!confirm(`Удалить ${emptyKeys.length} пустых эпизодов?`)) return;
            emptyKeys.forEach(k => {
                delete data.characters[charId].episodes[k];
            });
            if (selectedEp && emptyKeys.includes(selectedEp)) {
                selectedEp = null;
            }
            saveData();
            renderCharPanel(charId);
            updateCounter();
        });
    }

    const filterCheck = document.getElementById('questFilterCheck');
    if (filterCheck) {
        filterCheck.addEventListener('change', function() {
            showOnlyQuests = this.checked;
            renderCharPanel(charId);
        });
    }

    document.querySelectorAll('.closed-tag').forEach(function(el) {
        el.addEventListener('click', function() {
            const ep = this.dataset.ep;
            selectedClosed = (selectedClosed === ep) ? null : ep;
            selectedEp = null;
            renderCharPanel(charId);
        });
    });

    const epSelect = document.getElementById('epSelect');
    if (epSelect) {
        epSelect.addEventListener('change', function() {
            selectedEp = this.value || null;
            selectedClosed = null;
            renderCharPanel(charId);
        });
    }

    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const newPlayerName = document.getElementById('newPlayerName');
    if (addPlayerBtn) {
        addPlayerBtn.addEventListener('click', function() {
            if (!selectedEp) {
                alert('Сначала выберите эпизод');
                return;
            }
            const name = newPlayerName.value.trim();
            if (!name) {
                alert('Введите имя участника');
                return;
            }
            const ep = data.characters[charId].episodes[selectedEp];
            if (!ep) {
                alert('Эпизод не найден');
                return;
            }
            if (ep.closed) {
                alert('Эпизод уже завершён');
                return;
            }
            ep.players.push({ name: name, done: false });
            newPlayerName.value = '';
            saveData();
            renderCharPanel(charId);
        });
        newPlayerName.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addPlayerBtn.click();
        });
    }
}

// ================================================================
// ОТОБРАЖЕНИЕ ЭПИЗОДА
// ================================================================
function renderEpisodeDisplay(charId, epId) {
    if (!data) return '';
    const ch = data.characters[charId];
    const ep = ch.episodes[epId];
    if (!ep || ep.closed) return '';

    let nextPlayer = null;
    for (let p of ep.players) {
        if (!p.done) {
            nextPlayer = p;
            break;
        }
    }

    let playersHtml = '';
    ep.players.forEach(function(p, idx) {
        const doneClass = p.done ? 'done' : '';
        const nextClass = (p === nextPlayer) ? 'next' : '';
        const checked = p.done ? 'checked' : '';
        playersHtml += `
            <div class="player-row ${doneClass} ${nextClass}">
                <input type="checkbox" ${checked} data-pidx="${idx}">
                <span class="pname ${p.done ? 'done-name' : ''}">${p.name}</span>
                <button class="delete-player" data-pidx="${idx}" title="Удалить">✕</button>
            </div>
        `;
    });

    const allDone = ep.players.length > 0 && ep.players.every(p => p.done);

    const questStatus = ep.quest ? 'active' : '';

    // Ссылка на эпизод
    const linkHtml = ep.link ? `
        <div class="ep-link">
            <span class="link-label">🔗 Ссылка:</span>
            <a href="${ep.link}" target="_blank" rel="noopener noreferrer">${ep.link}</a>
        </div>
    ` : '';

    return `
        <div class="ep-display">
            <div class="ep-header">
                <div>
                    <div class="ep-title">${ep.title}</div>
                    <div class="ep-meta">${ep.meta || ''}</div>
                    ${linkHtml}
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span class="quest-badge ${questStatus}" id="questToggleBtn">
                        <span class="star">${ep.quest ? '⭐' : '☆'}</span>
                        ${ep.quest ? 'Квест' : 'Квест'}
                    </span>
                    <button class="btn btn-danger-outline btn-sm" id="deleteEpBtn" title="Удалить эпизод">🗑</button>
                </div>
            </div>

            <div class="players-vertical" id="playersContainer">
                ${playersHtml || '<div style="color:#9ca3af;font-style:italic;padding:8px 0;">Нет участников</div>'}
            </div>

            <div class="ep-actions">
                ${allDone ? `<button class="btn btn-success btn-sm" id="finishRoundBtn">🔄 Завершить круг</button>` : ''}
                <button class="btn btn-warning btn-sm" id="closeEpBtn">📌 Завершить эпизод</button>
                <button class="btn btn-outline btn-sm" id="editLinkBtn">✏️ Редактировать ссылку</button>
            </div>
        </div>
    `;
}

// ================================================================
// МОДАЛКА РЕДАКТИРОВАНИЯ ССЫЛКИ
// ================================================================
function showEditLinkModal(charId, epId) {
    const ep = data.characters[charId].episodes[epId];
    if (!ep) return;

    const currentLink = ep.link || '';
    const newLink = prompt('Введите ссылку на эпизод:', currentLink);
    if (newLink === null) return; // Отмена

    ep.link = newLink.trim();
    saveData();
    renderCharPanel(charId);
}

// ================================================================
// МОДАЛКА ДОБАВЛЕНИЯ ЭПИЗОДА
// ================================================================
function openAddEpModal() {
    addEpTitle.value = '';
    addEpMeta.value = '';
    addEpLink.value = '';
    addEpPlayers.value = '';
    addEpQuest.checked = false;
    if (selectedChar && data.characters[selectedChar]) {
        addEpCharSelect.value = selectedChar;
    } else {
        addEpCharSelect.value = '';
    }
    modalAddEp.classList.add('visible');
    setTimeout(() => addEpTitle.focus(), 100);
}

function closeAddEpModal() {
    modalAddEp.classList.remove('visible');
}

fabAddEp.addEventListener('click', openAddEpModal);

addEpCancel.addEventListener('click', closeAddEpModal);

modalAddEp.addEventListener('click', function(e) {
    if (e.target === modalAddEp) closeAddEpModal();
});

addEpConfirm.addEventListener('click', function() {
    const charId = addEpCharSelect.value;
    if (!charId || !data.characters[charId]) {
        alert('Выберите персонажа');
        return;
    }
    const title = addEpTitle.value.trim();
    if (!title) {
        alert('Введите название эпизода');
        return;
    }
    const meta = addEpMeta.value.trim();
    const link = addEpLink.value.trim();
    const playersText = addEpPlayers.value.trim();
    const players = playersText ? playersText.split('\n').map(s => s.trim()).filter(s => s) : [];
    const quest = addEpQuest.checked;

    const id = charId + '_' + Date.now();
    data.characters[charId].episodes[id] = {
        title: title,
        meta: meta,
        link: link,
        players: players.map(name => ({ name: name, done: false })),
        closed: false,
        result: '',
        quest: quest
    };

    saveData();
    closeAddEpModal();
    selectedEp = id;
    selectedChar = charId;
    renderAll();
    updateCounter();
});

// ================================================================
// ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ
// ================================================================
document.addEventListener('click', function(e) {
    if (!data) return;

    // Редактирование ссылки
    if (e.target.closest('#editLinkBtn')) {
        const btn = e.target.closest('#editLinkBtn');
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;
        showEditLinkModal(charId, epId);
        return;
    }

    // Переключение квеста
    if (e.target.closest('#questToggleBtn')) {
        const btn = e.target.closest('#questToggleBtn');
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        ep.quest = !ep.quest;
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Удаление эпизода
    if (e.target.closest('#deleteEpBtn')) {
        const btn = e.target.closest('#deleteEpBtn');
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const ep = data.characters[charId].episodes[epId];
        if (!ep) return;
        if (!confirm(`Удалить эпизод "${ep.title}"?`)) return;
        delete data.characters[charId].episodes[epId];
        if (selectedEp === epId) {
            selectedEp = null;
        }
        saveData();
        renderCharPanel(charId);
        updateCounter();
        return;
    }

    // Чекбоксы
    if (e.target.closest('.player-row input[type="checkbox"]')) {
        const cb = e.target;
        const row = cb.closest('.player-row');
        const container = row.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const pidx = parseInt(cb.dataset.pidx);
        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        ep.players[pidx].done = cb.checked;
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Удаление участника
    if (e.target.closest('.delete-player')) {
        const btn = e.target;
        const row = btn.closest('.player-row');
        const container = row.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const pidx = parseInt(btn.dataset.pidx);
        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        if (!confirm(`Удалить участника "${ep.players[pidx].name}"?`)) return;
        ep.players.splice(pidx, 1);
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Завершить круг
    if (e.target.closest('#finishRoundBtn')) {
        const btn = e.target;
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        ep.players.forEach(p => p.done = false);
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Завершить эпизод
    if (e.target.closest('#closeEpBtn')) {
        const btn = e.target;
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const ep = data.characters[charId].episodes[epId];
        if (!ep) return;
        if (!confirm(`Удалить эпизод "${ep.title}"?`)) return;
        delete data.characters[charId].episodes[epId];
        if (selectedEp === epId) {
            selectedEp = null;
        }
        saveData();
        renderCharPanel(charId);
        updateCounter();
        return;
    }

    // Чекбоксы
    if (e.target.closest('.player-row input[type="checkbox"]')) {
        const cb = e.target;
        const row = cb.closest('.player-row');
        const container = row.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const pidx = parseInt(cb.dataset.pidx);
        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        ep.players[pidx].done = cb.checked;
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Удаление участника
    if (e.target.closest('.delete-player')) {
        const btn = e.target;
        const row = btn.closest('.player-row');
        const container = row.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const pidx = parseInt(btn.dataset.pidx);
        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        if (!confirm(`Удалить участника "${ep.players[pidx].name}"?`)) return;
        ep.players.splice(pidx, 1);
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Завершить круг
    if (e.target.closest('#finishRoundBtn')) {
        const btn = e.target;
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        const ep = data.characters[charId].episodes[epId];
        if (!ep || ep.closed) return;
        ep.players.forEach(p => p.done = false);
        saveData();
        renderCharPanel(charId);
        return;
    }

    // Завершить эпизод
    if (e.target.closest('#closeEpBtn')) {
        const btn = e.target;
        const container = btn.closest('.ep-display');
        if (!container) return;
        const panel = container.closest('.char-panel');
        const select = panel ? panel.querySelector('.ep-select') : null;
        if (!select || !select.value) return;
        const epId = select.value;
        const charId = selectedChar;
        if (!charId || !epId) return;

        modalTarget = { charId, epId };
        modalComment.value = '';
        modalOverlay.classList.add('visible');
        setTimeout(function() { modalComment.focus(); }, 100);
        return;
    }
});

// ================================================================
// МОДАЛКА ЗАВЕРШЕНИЯ
// ================================================================
modalCancel.addEventListener('click', function() {
    modalOverlay.classList.remove('visible');
    modalTarget = null;
});

modalConfirm.addEventListener('click', function() {
    if (!modalTarget) return;
    const { charId, epId } = modalTarget;
    const comment = modalComment.value.trim();
    const ep = data.characters[charId].episodes[epId];
    if (!ep) return;
    ep.closed = true;
    ep.result = comment || '';
    ep.players.forEach(p => p.done = false);
    saveData();
    modalOverlay.classList.remove('visible');
    modalTarget = null;
    selectedEp = null;
    renderCharPanel(charId);
    updateCounter();
});

modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) {
        modalOverlay.classList.remove('visible');
        modalTarget = null;
    }
});

// ================================================================
// ЗАПУСК
// ================================================================
loadData();
</script>
</body>
</html>
